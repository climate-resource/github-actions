name: "Bump version"
description: >
  Bump a Python (uv) or Node (yarn/npm/pnpm) project's version,
  update the CHANGELOG via towncrier, commit, tag, push,
  and optionally land a second commit bumping main onto a pre-release version.

  Projects that derive their version from git tags (e.g. hatch-vcs) set
  `dynamic-versioning` and are released by the tag alone.

inputs:
  project-type:
    description: >
      Kind of project to bump, named after the package manager that owns the lockfile:

      'uv' — Python, version in pyproject.toml, bumped with `uv version`.

      'yarn', 'npm', 'pnpm' — Node, version in package.json, bumped with `npm version`
      (used purely as a version-bumping CLI, never as the package manager). The three
      differ only in which lockfile the `lock` input refreshes.
    required: false
    default: "uv"
  dynamic-versioning:
    description: >
      If 'true', take the base version from the latest reachable `v*` tag rather than from a manifest,
      for projects whose version is derived from git tags (e.g. hatch-vcs).
      With no such tag the base is 0.0.0.

      No manifest is rewritten and no lockfile is refreshed, so `workspace-packages` and `lock` do not apply.
      The `pre-release-bump` and `pre-release-base` flags are ignored as they do not apply.
      Only project-type 'uv' is supported.

      The checkout needs the tags, so use `fetch-depth: 0` when calling this action directly.
    required: false
    default: "false"
  bump-rule:
    description: >
      Whitespace-separated arguments describing the bump.

      For project-type 'uv', each segment becomes a separate `--bump <segment>`
      argument to `uv version --bump`, so values like `patch`, `minor`, `major`,
      `stable`, `minor alpha`, `patch rc`, or `major beta` are all valid. uv requires
      a release component (patch, minor, major, stable) alongside any prerelease
      segment (alpha, beta, rc, dev) when the current version is a stable release.

      For the Node project types, the value is passed through verbatim as arguments to
      `npm version <bump-rule words...> --no-git-tag-version`, e.g. `patch`,
      `preminor --preid alpha`, or `prerelease --preid rc`. The caller is responsible
      for passing a combination that is valid for the current version; invalid
      combinations simply fail the `npm version` call.
    required: true
  pre-release-bump:
    description: >
      Segment(s) appended after pre-release-base to bump main to a pre-release after
      tagging, so future commits do not share the tagged version.

      For project-type 'uv': one of dev, alpha, beta, rc, none.

      For the Node project types: verbatim `npm version` arguments (e.g. `--preid dev`),
      or 'none'.

      Use 'none' to skip the second commit.
    required: false
    default: "dev"
  pre-release-base:
    description: >
      Segment(s) applied before pre-release-bump in the second commit.

      For project-type 'uv': a bump rule (patch, minor, major, ...), defaults to 'patch'.

      For the Node project types: a verbatim `npm version` strategy word (e.g. `prepatch`),
      combined with pre-release-bump's arguments in the same `npm version` call.

      Use 'none' to skip the base and only apply pre-release-bump.
    required: false
    default: "patch"
  update-changelog:
    description: "If 'true', run towncrier to build the CHANGELOG before tagging."
    required: false
    default: "true"
  commit-email:
    description: "Email for the CI commit author."
    required: false
    default: "ci-runner@climate-resource.invalid"
  workspace-packages:
    description: >
      Optional newline-separated list of workspace packages to mirror the bumped
      version onto (in addition to the root project).

      For project-type 'uv': uv workspace package names.

      For the Node project types: paths (relative to the repo root) to the workspace
      packages' directories, e.g. `apps/analysis-portal`.
    required: false
    default: ""
  lock:
    description: >
      If 'true', refresh the lockfile after each version change, using the command
      for the project type: `uv lock`, `yarn install --mode=update-lockfile`,
      `npm install --package-lock-only`, or `pnpm install --lockfile-only`.
    required: false
    default: "true"
  pre-commit-command:
    description: >
      Optional shell command run after the changelog build and before each bump commit.

      Use it to regenerate version-derived files (e.g. an OpenAPI schema) so they stay in sync in the tagged commit.
      The commit uses `git commit -a`, so any files the command regenerates are picked up automatically.
      The command must succeed; a non-zero exit aborts the bump.
    required: false
    default: ""
  pre-commit-skip:
    description: "If 'true', pass -n to git commit to skip pre-commit hooks."
    required: false
    default: "false"
  push:
    description: "If 'true', push the bump commit, tag, and pre-release commit."
    required: false
    default: "true"

outputs:
  base-version:
    description: "The version before bumping."
    value: ${{ steps.bump.outputs.base-version }}
  new-version:
    description: "The new tagged version (no 'v' prefix)."
    value: ${{ steps.bump.outputs.new-version }}
  tag:
    description: "The new git tag (with 'v' prefix)."
    value: ${{ steps.bump.outputs.tag }}
  dev-version:
    description: "The pre-release version landed on main after tagging (if any)."
    value: ${{ steps.bump.outputs.dev-version }}
  is-prerelease:
    description: "'true' when the tagged version is a pre-release (a|b|rc|dev)."
    value: ${{ steps.bump.outputs.is-prerelease }}

runs:
  using: "composite"
  steps:
    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${{ inputs.commit-email }}"

    - name: Bump, changelog, commit, tag
      id: bump
      shell: bash
      env:
        PROJECT_TYPE: ${{ inputs.project-type }}
        DYNAMIC_VERSIONING: ${{ inputs.dynamic-versioning }}
        BUMP_RULE: ${{ inputs.bump-rule }}
        PRE_RELEASE_BUMP: ${{ inputs.pre-release-bump }}
        PRE_RELEASE_BASE: ${{ inputs.pre-release-base }}
        UPDATE_CHANGELOG: ${{ inputs.update-changelog }}
        WORKSPACE_PACKAGES: ${{ inputs.workspace-packages }}
        RUN_LOCK: ${{ inputs.lock }}
        PRE_COMMIT_COMMAND: ${{ inputs.pre-commit-command }}
        COMMIT_SKIP_HOOKS: ${{ inputs.pre-commit-skip }}
        DO_PUSH: ${{ inputs.push }}
      # The logic lives in bump.py so it gets syntax highlighting, linting and
      # unit tests. `uv run --script` provisions its interpreter and
      # dependencies from the PEP 723 header in that file.
      run: uv run --script "${GITHUB_ACTION_PATH}/bump.py"
