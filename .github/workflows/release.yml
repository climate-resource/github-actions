name: Release

# Uses the bump workflow, then does a major/minor tag update.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    uses: ./.github/workflows/bump.yaml
    permissions:
      contents: write
    with:
      bump-rule: ${{ inputs.bump }}
      update-changelog: false
      pre-release-bump: none
      create-release: true
      release-draft: false
      # Pin the composite actions to the dispatched commit so the release exercises the current code, not the @v1 tag.
      actions-ref: ${{ github.sha }}

  update-tags:
    name: Update major and minor tags
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Check out the release commit so the moving tags point at it.
          ref: ${{ needs.bump.outputs.tag }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update major and minor tags
        env:
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euxo pipefail

          MINOR="${TAG%.*}"   # v1.2.3 -> v1.2
          MAJOR="${MINOR%.*}" # v1.2   -> v1

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -fa "${MINOR}" -m "Release ${TAG}"
          git tag -fa "${MAJOR}" -m "Release ${TAG}"

          git push --force origin "${MINOR}"
          git push --force origin "${MAJOR}"
