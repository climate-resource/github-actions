# Reusable workflow: bump version (optionally with changelog) and optionally
# draft a GitHub release in the same dispatch.
#
# An optional follow-up commit can be made to bump the version onto a pre-release (e.g. 1.2.3 -> 1.3.0a1) after tagging the stable release (1.2.3).
# This is useful to differentiate between the tagged release commit and the post-release commit on main.
# The default is to make a "patch dev" post-release commit (e.g. 1.2.3 -> 1.2.4.dev0).
#
# Consumer projects call this from a thin `bump.yaml` in their own repo:
#
#   jobs:
#     bump:
#       uses: climate-resource/github-actions/.github/workflows/bump.yaml@v1
#       permissions:
#         contents: write
#       with:
#         bump-rule: ${{ inputs.bump_rule }}
#
# Projects whose version comes from git tags (e.g. hatch-vcs) pass `dynamic-versioning: true`,
# which tags without editing any manifest and lands no post-tag commit.
#
# A PAT is only needed when branch protection blocks the github-actions bot or
# when the release is auto-published and downstream workflows must fire. 
# In that case pass it as `secrets: token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}`.

name: Bump
on:
  workflow_call:
    inputs:
      project-type:
        description: >
          Kind of project to bump, named after the package manager that owns the lockfile: 
          'uv' (Python), or 'yarn' / 'npm' / 'pnpm' (Node). 
          
          The Node types behave identically apart from which lockfile is refreshed.
          See the bump-version action for how bump-rule/pre-release-base/pre-release-bump differ per type.
        required: false
        type: string
        default: "uv"
      dynamic-versioning:
        description: |
          Take the base version from the latest reachable v* tag rather than from a manifest,
          for projects whose version is derived from git tags (e.g. hatch-vcs).
          With no such tag the base is 0.0.0.

          No manifest is rewritten and no lockfile is refreshed,
          so workspace-packages does not apply and neither does the post-tag commit,
          which makes pre-release-bump and pre-release-base inert.

          Only project-type 'uv' is supported.
        required: false
        type: boolean
        default: false
      bump-rule:
        description: |
          For project-type 'uv': whitespace-separated list of segments passed to
          uv version --bump. Each segment becomes a separate --bump.

          Examples: "patch",  "minor", "major", "stable", "minor alpha", "patch rc".

          From a stable version, prerelease segments (alpha, beta, rc, dev) must be combined with a release segment.

          For the Node project types: passed through verbatim as arguments to
          `npm version <bump-rule words...>`, e.g. "patch" or "preminor --preid alpha".
        required: true
        type: string
      pre-release-base:
        description: |
          Base bump applied before the pre-release segment (patch|minor|major|none).
          This is useful to land the post-tag commit on a more appropriate version.

          i.e. from 1.2.3, a pre-release-base of minor and pre-release-bump of alpha would land on 1.3.0a0,
          while a pre-release-base of none would land on 1.2.4a1.

          Use 'none' to skip the base bump and only add the pre-release segment.
        required: false
        type: string
        default: "patch"

      pre-release-bump:
        description: |
          Pre-release segment for the post-tag commit (dev|alpha|beta|rc|none).

          Use 'none' to skip the post-release commit. This would cause a new stable version in pyproject.toml (without a tag).
        required: false
        type: string
        default: "dev"
      update-changelog:
        description: "Run towncrier to update CHANGELOG before tagging."
        required: false
        type: boolean
        default: true
      workspace-packages:
        description: >
          Newline-separated workspace packages to mirror the version onto: uv package
          names for project-type 'uv', or paths relative to the repo root for the
          Node project types.
        required: false
        type: string
        default: ""
      commit-email:
        description: "Email for the CI commit author."
        required: false
        type: string
        default: "ci-runner@climate-resource.invalid"
      pre-commit-command:
        description: "Optional shell command run before each bump commit to regenerate version-derived files."
        required: false
        type: string
        default: ""
      python-version:
        description: "Python version to install via setup-uv. Also used to run towncrier (via uvx) for the Node project types."
        required: false
        type: string
        default: ""
      node-version:
        description: "Node version to install via actions/setup-node. Only used for the Node project types."
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner label for the bump job."
        required: false
        type: string
        default: "ubuntu-latest"
      create-release:
        description: "Run the release step after bumping."
        required: false
        type: boolean
        default: false
      release-draft:
        description: "Create the GitHub release as a draft. Set false to auto-publish."
        required: false
        type: boolean
        default: true
      release-files:
        description: "Newline-separated globs of files to attach to the release."
        required: false
        type: string
        default: ""
      release-changelog-path:
        description: "Path to the CHANGELOG file to extract release notes from."
        required: false
        type: string
        default: "CHANGELOG.md"
      release-changelog-script:
        description: "Optional path to a script that prints the latest changelog section. Overrides release-changelog-path."
        required: false
        type: string
        default: ""
      build-command:
        description: "Optional shell command run before the release step (e.g. 'uv build')."
        required: false
        type: string
        default: ""
      submodules:
        description: "Check out submodules. Default: '' (don't check out submodules), Options: 'true', 'recursive'"
        required: false
        type: string
        default: ''
    secrets:
      token:
        description: >
          Optional PAT used to push commits/tags and create the release.
          Defaults to the workflow's GITHUB_TOKEN.
          Provide a PAT when the repo has branch protection that blocks the github-actions bot,
          or when the release is auto-published and downstream `release: published` workflows must fire.
        required: false
    outputs:
      base-version:
        description: "Version prior to bump."
        value: ${{ jobs.bump.outputs.base-version }}
      new-version:
        description: "Version after bump (no v prefix)."
        value: ${{ jobs.bump.outputs.new-version }}
      tag:
        description: "Git tag created (with v prefix)."
        value: ${{ jobs.bump.outputs.tag }}
      dev-version:
        description: "Pre-release version landed on main after tagging (if any)."
        value: ${{ jobs.bump.outputs.dev-version }}

jobs:
  bump:
    name: "Bump version and create changelog"
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    outputs:
      base-version: ${{ steps.bump.outputs.base-version }}
      new-version: ${{ steps.bump.outputs.new-version }}
      tag: ${{ steps.bump.outputs.tag }}
      dev-version: ${{ steps.bump.outputs.dev-version }}
      is-prerelease: ${{ steps.bump.outputs.is-prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}
          submodules: ${{ inputs.submodules }}

      - name: Setup uv
        uses: climate-resource/github-actions/setup-uv@v1.8.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup Node
        if: contains(fromJSON('["yarn", "npm", "pnpm"]'), inputs.project-type)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # corepack provisions yarn and pnpm from the project's packageManager
      # field. npm ships with Node, so it needs nothing here.
      - name: Enable corepack
        if: contains(fromJSON('["yarn", "pnpm"]'), inputs.project-type)
        shell: bash
        run: corepack enable

      - name: Bump version
        id: bump
        uses: climate-resource/github-actions/bump-version@v1.8.0
        with:
          project-type: ${{ inputs.project-type }}
          dynamic-versioning: ${{ inputs.dynamic-versioning }}
          bump-rule: ${{ inputs.bump-rule }}
          pre-release-bump: ${{ inputs.pre-release-bump }}
          pre-release-base: ${{ inputs.pre-release-base }}
          update-changelog: ${{ inputs.update-changelog }}
          workspace-packages: ${{ inputs.workspace-packages }}
          commit-email: ${{ inputs.commit-email }}
          pre-commit-command: ${{ inputs.pre-commit-command }}

      - name: Build artifacts
        if: inputs.create-release && inputs.build-command != '' && steps.bump.outputs.is-prerelease != 'true'
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          bash -c "${BUILD_COMMAND}"

      - name: Create GitHub release
        if: inputs.create-release && steps.bump.outputs.is-prerelease != 'true'
        uses: climate-resource/github-actions/draft-release@v1.8.0
        with:
          token: ${{ secrets.token || github.token }}
          tag: ${{ steps.bump.outputs.tag }}
          files: ${{ inputs.release-files }}
          changelog-path: ${{ inputs.release-changelog-path }}
          changelog-script: ${{ inputs.release-changelog-script }}
          draft: ${{ inputs.release-draft }}

      - name: Skipped release (pre-release tag)
        if: inputs.create-release && steps.bump.outputs.is-prerelease == 'true'
        shell: bash
        run: |
          echo "::notice::Skipping draft GitHub release for pre-release tag ${{ steps.bump.outputs.tag }}"
