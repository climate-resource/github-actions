name: Tests

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "setup-uv/action.yml"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - "setup-uv/action.yml"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: ./setup-uv

      - name: Run tests
        shell: bash
        run: uv run --group dev pytest
