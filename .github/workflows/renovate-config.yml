name: Renovate config

on:
  pull_request:
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-config.yml"
  push:
    branches:
      - main
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-config.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.93.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Renovate config
        shell: bash
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json
