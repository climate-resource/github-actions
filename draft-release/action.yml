name: "Draft GitHub release"
description: >
  Generate a draft GitHub release for a Python project. 
  
  Reads the project version from pyproject.toml, generates release notes from the CHANGELOG and git log, and uploads any provided artifacts.

inputs:
  token:
    description: "Token used to create the release. Use a PAT if downstream workflows must fire."
    required: true
  tag:
    description: >
      Tag to release. 
      
      Defaults to the tag that triggered the workflow when empty. 
      Required when invoked outside of a tag push.
    required: false
    default: ""
  files:
    description: "Newline-separated glob(s) of artifact files to attach to the release."
    required: false
    default: ""
  changelog-script:
    description: >
      Optional path to a Python script that prints the latest changelog section to stdout.
      Only needed for project-specific changelog formatting; for a non-default changelog location use changelog-path instead.
      When set, its output replaces the auto-generated changelog block.
    required: false
    default: ""
  changelog-path:
    description: "Path to the CHANGELOG file to extract notes from when no script is provided."
    required: false
    default: "CHANGELOG.md"
  release-template:
    description: "Path to write the assembled release notes."
    required: false
    default: ".github/release_template.md"
  draft:
    description: "Create the release as a draft."
    required: false
    default: "true"
  prerelease:
    description: "Mark the release as a pre-release."
    required: false
    default: "false"

outputs:
  version:
    description: "The version (without v prefix) released."
    value: ${{ steps.version.outputs.version }}
  tag:
    description: "The git tag released."
    value: ${{ steps.version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Resolve tag and version
      id: version
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        TAG="${INPUT_TAG}"
        if [[ -z "${TAG}" ]]; then
          TAG="${GITHUB_REF_NAME}"
        fi
        VERSION="${TAG#v}"
        echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "PROJECT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
        echo "PROJECT_TAG=${TAG}" >> "${GITHUB_ENV}"

    - name: Generate release notes
      shell: bash
      env:
        CHANGELOG_SCRIPT: ${{ inputs.changelog-script }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        RELEASE_TEMPLATE: ${{ inputs.release-template }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${RELEASE_TEMPLATE}")"
        : > "${RELEASE_TEMPLATE}"

        {
          echo ""
          echo "## Changelog"
          echo ""
        } >> "${RELEASE_TEMPLATE}"

        if [[ -n "${CHANGELOG_SCRIPT}" && -f "${CHANGELOG_SCRIPT}" ]]; then
          uv run python "${CHANGELOG_SCRIPT}" >> "${RELEASE_TEMPLATE}"
        elif [[ -f "${CHANGELOG_PATH}" ]]; then
          awk '
            /^<!-- towncrier release notes start -->/ { found_marker=1; next }
            found_marker && /^## / {
              if (started) { exit }
              started=1; next
            }
            started { print }
          ' "${CHANGELOG_PATH}" >> "${RELEASE_TEMPLATE}"
        else
          echo "_No CHANGELOG.md found._" >> "${RELEASE_TEMPLATE}"
        fi

        {
          echo ""
          echo "## Commits"
          echo ""
        } >> "${RELEASE_TEMPLATE}"

        PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
        if [[ -n "${PREV_TAG}" ]]; then
          git log "${PREV_TAG}..${TAG}" --pretty='format:* %h %s' --no-merges >> "${RELEASE_TEMPLATE}"
        else
          git log "${TAG}" --pretty='format:* %h %s' --no-merges >> "${RELEASE_TEMPLATE}"
        fi

        echo "Release notes written to ${RELEASE_TEMPLATE}:"
        cat "${RELEASE_TEMPLATE}"

    - name: Create release draft
      uses: softprops/action-gh-release@v3.0.0
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        body_path: ${{ inputs.release-template }}
        token: ${{ inputs.token }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        files: ${{ inputs.files }}
